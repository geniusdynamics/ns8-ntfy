#
# ntfy state/backup include patterns for Restic
# Syntax reference: https://pkg.go.dev/path/filepath#Glob
# Restic --files-from: https://restic.readthedocs.io/en/stable/040_backup.html#including-files
# Only lines starting with "state/" or "volumes/" are considered by NS8.
#

# bin/module-dump-state stops ntfy, copies its databases, attachments and
# server.yml into this directory, then restarts it before Restic uploads the
# snapshot. Keeping the path inside the ntfy-app volume also mounts that
# volume on restore.
volumes/ntfy-app/.ntfy-backup-snapshot

# Access token and Web Push keys
state/passwords.env
